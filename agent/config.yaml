# Pi Control Panel - Agent Configuration

# ===========================================
# Agent Identity
# ===========================================
agent:
  name: "pi-agent"
  version: "1.0.0"
  
# ===========================================
# Socket Configuration
# ===========================================
socket:
  path: "/run/pi-agent/agent.sock"
  permissions: "0660"
  group: "fou4"

# ===========================================
# Discovery Settings
# ===========================================
discovery:
  # Interval between discovery scans (seconds)
  interval: 30
  
  # Providers to enable
  providers:
    - systemd
    - network
    - devices

# ===========================================
# Telemetry Settings
# ===========================================
telemetry:
  # Collection interval (seconds)
  interval: 30
  
  # Database path
  db_path: "/var/lib/pi-control/telemetry.db"
  
  # Batch size for writes
  batch_size: 60
  
  # Degrade mode thresholds
  degrade:
    queue_size: 10000
    cpu_percent: 90
    io_wait_percent: 50
    
  # Metrics to collect
  metrics:
    host:
      cpu: true
      memory: true
      disk: true
      temperature: true
      network: true
    containers: true
    services: true

# ===========================================
# Health Beacon
# ===========================================
health:
  # Beacon interval (seconds)
  interval: 10
  
  # Endpoint to report to
  endpoint: "http://localhost:8080/api/agent/health"

# ===========================================
# Job Runner
# ===========================================
jobs:
  # Maximum concurrent jobs
  max_concurrent: 2
  
  # Default timeout (seconds)
  default_timeout: 600
  
  # State persistence
  db_path: "/var/lib/pi-control/jobs.db"
  backup_dir: "/opt/pi-control/backups"
  backup_key_file: "/etc/pi-control/backup_encryption.key"
  restore_dir: "/var/lib/pi-control/restore"
  install_dir: "/opt/pi-control"
  config_dir: "/etc/pi-control"
  repository: "https://github.com/BGirginn/rasp_pi_webUI.git"
  install_user: "fou4"

# ===========================================
# MQTT Bridge
# ===========================================
mqtt:
  enabled: true
  host: "localhost"
  advertised_host: "raspberrypi.local"
  port: 8883
  username: "panel"
  password_file: "/etc/pi-control/secrets/mqtt_panel_password"
  ca_file: "/etc/pi-control/mqtt/ca.crt"
  tls: true
  provisioning_enabled: true
  provisioning_dir: "/etc/mosquitto/pi-control"
  secrets_dir: "/etc/pi-control/secrets"
  mosquitto_conf: "/etc/mosquitto/conf.d/pi-control.conf"
  mosquitto_password_file: "/etc/mosquitto/pi-control.passwd"
  mosquitto_acl_file: "/etc/mosquitto/pi-control.acl"
  
  # Topics
  topics:
    devices: "pi-control/v1/devices/+/telemetry"
    status: "pi-control/v1/devices/+/status"
    command_results: "pi-control/v1/devices/+/command-result"
    commands: "pi-control/v1/devices/{device_id}/command"

# ===========================================
# Logging
# ===========================================
logging:
  level: "INFO"
  format: "json"
  file: "/var/log/pi-agent/agent.log"
  max_size_mb: 10
  backup_count: 5

# ===========================================
# Resource Classification
# ===========================================
classification:
  # CORE services (read-only, cannot be stopped)
  core:
    - "caddy.service"
    - "NetworkManager.service"
    - "pi-control.service"
    - "tailscaled.service"
    - "pi-agent.service"
    - "systemd-journald.service"
    - "networking.service"
    - "systemd-networkd.service"
    - "systemd-resolved.service"
    - "dbus.service"
    - "polkit.service"
    - "ssh.service"
    - "sshd.service"
    - "wpa_supplicant.service"
    
  # SYSTEM services (can restart, cannot stop)
  system:
    - "ssh.service"
    - "sshd.service"
    - "nginx.service"
    - "mosquitto.service"
    - "avahi-daemon.service"
    - "bluetooth.service"
    - "wpa_supplicant.service"
